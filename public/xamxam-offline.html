<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — Majalis</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #f2e6c9, #faf6ec 70%);
        color: #241d14;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        border: 1px solid rgba(243, 210, 122, 0.25);
        border-radius: 20px;
        padding: 32px 28px;
        background: rgba(36, 29, 20, 0.04);
      }
      .badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: linear-gradient(135deg, #f3d27a, #c9973a);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #0c0c0a;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #6b5c47;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">✦</div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Reconnectez-vous à Internet pour accéder aux livres, playlists, vidéos
        et wirds de Majalis.
      </p>
    </div>
  </body>
</html>
